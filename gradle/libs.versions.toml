[versions]
# THE artifact version. Every published module carries it.
fieldtrack = "v1.0.1-alpha-05"
traker = "0.1.1-alpha01"

# Toolchain — pinned to the React Native 0.81 baseline (AGP 8.11 / Kotlin 2.1.20 / SDK 36)
# so AARs built here stay consumable by RN 0.81 hosts (Kotlin 2.1.x metadata, compileSdk 36).
# Verified against Google Maven / Maven Central 2026-08-21.
agp = "8.11.0"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
javaTarget = "17"
# Bytecode target for the published library modules. 11, not 17, deliberately: at
# jvmTarget 17+ Kotlin writes the `PermittedSubclasses` class-file attribute for sealed
# types, and AGP's embedded javadoc generator (old Dokka/ASM) cannot read it —
# `javaDocReleaseGeneration` then fails with "PermittedSubclasses requires ASM9"
# (seen on JitPack against fieldtrack-geo's sealed Verdict). Java 11 bytecode loads
# unchanged on the Java 17 toolchain RN 0.81 hosts use; only this attribute is dropped,
# and Kotlin's own sealed enforcement lives in its metadata, not the attribute.
javaBytecode = "11"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# Libraries — kept at versions whose Kotlin metadata is ≤ 2.2 (readable by Kotlin 2.1.20)
# and whose AAR metadata requires compileSdk ≤ 36, per the RN 0.81 baseline above.
coroutines = "1.10.2"
serialization = "1.8.1"
room = "2.7.2"
datastore = "1.1.7"
coreKtx = "1.16.0"
appcompat = "1.7.1"
composeBom = "2025.06.01"
activityCompose = "1.10.1"
fragment = "1.8.8"
lifecycleCompose = "2.9.1"
mapsCompose = "6.7.2"
lifecycle = "2.9.1"
trakerAll = "v0.1.1-alpha01"
work = "2.10.2"
# 21.4.0 / 20.0.0 ship Kotlin 2.3 metadata, unreadable by the Kotlin 2.1.20 compiler.
playServicesLocation = "21.3.0"
playServicesMaps = "19.2.0"
okhttp = "5.1.0"
# Retrofit 3 requires OkHttp 5, which is what `okhttp` above already is.
retrofit = "3.0.0"
gson = "2.11.0"
# Ed25519 below API 33. java.security only gained it at 33 and minSdk is 26, so the
# licence gate needs its own implementation — see license/Ed25519.kt.
tink = "1.13.0"
# Lint tooling tracks AGP with a +23 major offset (AGP 8.11.0 -> lint 31.11.0).
lint = "31.11.0"

# Test
junit = "4.13.2"
kotlinxCoroutinesTest = "1.10.2"
robolectric = "4.16.1"
androidxTestJunit = "1.3.0"
androidxTestCore = "1.7.0"
truth = "1.4.5"

[libraries]
# --- Kotlin / coroutines ---
fieldtrack = { module = "com.github.fieldtrack360.fieldtrack:fieldtrack", version.ref = "fieldtrack" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- AndroidX ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

# --- Compose ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# --- Room ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }


# --- Play Services ---
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }

# --- Licensing ---
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

# --- HTTP (sync uses it compileOnly; core links it for the licence check) ---
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Never a dependency of ours — declared only so fieldtrack-core can constrain it. A host
# that brings okhttp-urlconnection (React Native does, for its cookie jar) has to get it
# at the same version as the okhttp core jar we pull in; see that constraint's comment.
okhttp-urlconnection = { module = "com.squareup.okhttp3:okhttp-urlconnection", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }

# --- Lint (custom rules; bundled into the AARs via lintPublish) ---
lint-api = { module = "com.android.tools.lint:lint-api", version.ref = "lint" }
lint-checks = { module = "com.android.tools.lint:lint-checks", version.ref = "lint" }
lint-tests = { module = "com.android.tools.lint:lint-tests", version.ref = "lint" }

# --- Test ---
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Owns `room.schemaLocation` so each variant exports to its own directory. Setting the
# KSP arg by hand pointed every variant at one path, and kspDebug/kspRelease then raced
# on the same file — see fieldtrack-core/build.gradle.kts.
room = { id = "androidx.room", version.ref = "room" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
