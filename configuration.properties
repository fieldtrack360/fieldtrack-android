# Shared build configuration. Unlike `local.properties` this file IS committed, so every
# clone and CI runner builds against the same endpoints without anyone hand-copying a
# template first.
#
# Two lookups read this file, and they differ on purpose.
#
# PRODUCT CONFIGURATION — one value the whole team and every CI runner build against.
# `local.properties` is NOT consulted; a per-machine override is how one laptop ships a
# build pointed somewhere nobody tested. Highest first:
#   1. Gradle property   -PfieldtrackLicenseUrl=...
#   2. Environment       FIELDTRACK_LICENSE_URL=...
#   3. this file
# Applies to: FIELDTRACK_LICENSE_URL, FIELDTRACK_RESPONSE_KEY.
#
# PER-DEVELOPER CONFIGURATION — a value that legitimately differs by machine, such as a dev
# tunnel. `local.properties` wins, and a blank or missing key there falls through to this
# file, so you override one key without restating the rest:
#   1. local.properties  (gitignored, per-machine)
#   2. this file
# Applies to: SYNC_URL, OSRM_BASE_URL.
#
# NEVER put a credential in this file. It is in version control, permanently, in every
# clone. Credentials belong in `local.properties`; the keys for them are listed at the
# bottom with empty values so the names are discoverable, not so they can be filled in.
#
# `sdk.dir` deliberately does not appear here — it is an absolute path to one machine's
# Android SDK, and Android Studio writes it into `local.properties` on first sync.

# --- Shared, non-credential values -------------------------------------------------

# FieldTrack licence API root, consumed by fieldtrack-core/build.gradle.kts and compiled
# into BuildConfig.LICENSE_BASE_URL. Include the version segment: the transport appends
# "/verify" and nothing else, so moving to /api/v2 is a change here rather than an SDK
# release. Compiled into the artifact and readable in any published AAR or installed APK —
# that is fine for an endpoint the device has to reach, and is why it is not a secret.
#
# PRODUCT CONFIGURATION: this file is the source. Editing FIELDTRACK_LICENSE_URL in
# local.properties does nothing — the build does not look there for it. To point one build
# elsewhere for one run, pass -PfieldtrackLicenseUrl=... or export FIELDTRACK_LICENSE_URL.
FIELDTRACK_LICENSE_URL=https://sdk.fieldtrack360.com/api/v1/

# The key that verifies /verify RESPONSES. Standard base64 of 32 raw bytes, compiled into
# BuildConfig.LICENSE_RESPONSE_KEY, and the only key the SDK still compiles in.
#
# A PUBLIC verification key, not a credential — which is why it belongs in this file. It
# authenticates what the licence server says about a licence today; the private half that
# signs those responses never leaves the server. Compiling it in is the whole mechanism:
# fetching it at runtime from the server it authenticates would be circular, and a device
# owner running a proxy would simply serve their own. It ships inside every published AAR
# and installed APK regardless of which file it is typed into.
#
# PRODUCT CONFIGURATION: this file is the source, local.properties is not consulted. Blank
# is not a safe default — it disables the revocation check entirely, with no request made
# and no response ever trusted.
FIELDTRACK_RESPONSE_KEY=PET/V2e0GH9MaqiMSJGIiOycM1hn+R2nZSDOuI2vCdQ=

# Upload endpoint for TrackerSync, read by sample-android/build.gradle.kts into
# BuildConfig.SYNC_URL. The FULL URL the batch is POSTed to, not a base. Blank disables the
# upload half entirely — points accumulate in Room and nothing opens a socket, which is the
# offline-first default the SDK is built around.
#
# Not a credential, but it IS per-developer: the value below is a dev tunnel pointing at
# one laptop and it is ephemeral. Override it in local.properties rather than editing this
# line, otherwise the change lands in everyone's next pull.
SYNC_URL=https://xt6g2kb5-3000.inc1.devtunnels.ms/locations

# OSRM base URL for road snapping. Blank is a working configuration and the default: no
# RoadSnapProvider is installed, buildTrack never leaves the device, and the track renders
# from raw fixes. Only set this to an instance you run — the public demo server documents
# no availability guarantee and no rate limit worth relying on.
OSRM_BASE_URL=

# --- Credentials: set these in local.properties, never here ------------------------
#
# The build does not read these keys from this file at all — each one's lookup stops at
# `local.properties`, one step above. They are listed here, blank, so the names are
# discoverable without grepping the build scripts.
#
# A value typed on any line below therefore does nothing, and that is deliberate. Silently
# working is what turns a hurried paste into a live credential published to everyone with
# repo access, in every clone, recoverable from git history long after the line is deleted.
# Put it in `local.properties` (gitignored), or pass `-P…` / an environment variable in CI.
#
# Only these two. The licence URL and the response public key are product configuration and
# live above; neither is a secret, and both ship inside the artifact either way.

# Google Maps key for the Track and Debug screens. Reaches the build as
# BuildConfig.MAPS_API_KEY and the com.google.android.geo.API_KEY manifest placeholder.
# Blank is supported: the map screens say a key is missing instead of showing a blank map.

